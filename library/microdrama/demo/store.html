<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#120D1A">
<link rel="icon" href="data:,">
<title>Wiom TV — सैशे स्टोर (डेमो)</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0B0812;height:100%;overflow:hidden}
  body{font-family:"Noto Sans","Noto Sans Devanagari","Nirmala UI",system-ui,-apple-system,sans-serif;
    color:#FAF9FC;line-height:1.5;overscroll-behavior:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;background:#120D1A;overflow:hidden}
  button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
  .hide{display:none!important}

  /* ---------- HOME: player + store ---------- */
  #player-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;flex:0 0 auto}
  #tv{width:100%;height:100%;object-fit:cover;display:block;background:#000 center/cover no-repeat}
  #tv-fallback{position:absolute;inset:0;background-size:cover;background-position:center}
  .lv{position:absolute;top:calc(9px + env(safe-area-inset-top,0px));left:10px;display:flex;align-items:center;gap:5px;
    background:rgba(0,0,0,.62);border-radius:999px;padding:4px 10px;font-size:9.5px;font-weight:800;letter-spacing:.09em}
  .lv i{width:5px;height:5px;border-radius:50%;background:#E01E00;display:block;animation:blink 2s infinite}
  @keyframes blink{50%{opacity:.35}}
  #tv-sound{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:34px;height:34px;
    border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:15px}
  .redline{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:#E01E00}

  #chbar{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex:0 0 auto}
  #chbar .cn{font-size:12px;font-weight:800;background:rgba(255,255,255,.1);border-radius:6px;padding:3px 8px}
  #chbar .nm{flex:1;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chbar .all{font-size:12px;font-weight:800;color:#FFB2E4}

  #store{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    padding:14px 14px calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;
    background:linear-gradient(180deg,rgba(217,0,141,.07),transparent 30%)}
  .sech{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
  .sech .t{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6E6579}
  .sech .t.on{color:#3DC98A}
  .sech .hint{font-size:10px;color:#4B4358;font-weight:600}

  .runcard{display:flex;align-items:center;gap:11px;border-radius:14px;padding:12px;
    border:1px solid rgba(255,178,228,.32);background:linear-gradient(135deg,rgba(217,0,141,.22),rgba(109,23,206,.14))}
  .runcard.amb{border-color:rgba(255,128,0,.5);background:linear-gradient(135deg,rgba(255,128,0,.2),rgba(217,0,141,.1))}
  .runcard img{width:34px;height:34px;border-radius:9px;flex:0 0 auto}
  .runcard .ri{flex:1;min-width:0}
  .runcard .rn{font-size:12.5px;font-weight:800}
  .runcard .rt{font-size:16px;font-weight:900;color:#FFB2E4;margin-top:1px;font-variant-numeric:tabular-nums}
  .runcard.amb .rt{color:#FFB067}
  .mini{height:4px;border-radius:2px;background:rgba(255,255,255,.16);margin-top:6px;overflow:hidden}
  .mini i{display:block;height:100%;background:linear-gradient(90deg,#D9008D,#FFB2E4);border-radius:2px;transition:width .4s}
  .mini i.amb{background:linear-gradient(90deg,#FF8000,#FFC076)}
  .runcard .open{background:#FAF9FC;color:#161021;border-radius:10px;padding:11px 14px;font-size:12.5px;font-weight:800;flex:0 0 auto}

  .appblk{display:flex;flex-direction:column;gap:9px;margin-bottom:18px}
  .apphd{display:flex;align-items:center;gap:10px}
  .apphd img{width:34px;height:34px;border-radius:9px;flex:0 0 auto;border:1px solid rgba(255,255,255,.1)}
  .apphd .ai{flex:1;min-width:0}
  .apphd .an{font-size:13.5px;font-weight:800}
  .apphd .ad{font-size:10.5px;color:#A7A1B2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .buy{background:#D9008D;border-radius:11px;padding:8px 13px;text-align:center;flex:0 0 auto;min-width:66px}
  .buy .pr{font-size:15px;font-weight:900;line-height:1.05}
  .buy .du{font-size:9.5px;font-weight:700;color:rgba(255,255,255,.85)}
  .prow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -14px;padding-left:14px;padding-right:14px}
  .prow::-webkit-scrollbar{display:none}
  .prow .pi{width:78px;flex:0 0 auto}
  .prow .pi img{width:78px;height:117px;border-radius:9px;display:block;object-fit:cover;border:1px solid rgba(255,255,255,.09)}
  .prow .pi .pt{font-size:10px;color:#C9C3D4;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

  .pastrow{display:flex;align-items:center;gap:10px;padding:11px;border-radius:12px;background:rgba(255,255,255,.045)}
  .pastrow img{width:28px;height:28px;border-radius:8px;opacity:.6;flex:0 0 auto}
  .pastrow .pi2{flex:1;min-width:0}
  .pastrow .pn{font-size:12px;font-weight:700;color:#A7A1B2}
  .pastrow .pd{font-size:10px;color:#665E75;margin-top:1px}
  .pastrow .again{background:rgba(255,255,255,.1);border-radius:9px;padding:9px 12px;font-size:11px;font-weight:800;flex:0 0 auto}

  /* ---------- PROMO ---------- */
  #promo{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
  #pv{width:100%;height:100%;object-fit:contain;background:#000;transition:filter .45s,transform .45s}
  #pv.frozen{filter:blur(6px) brightness(.5);transform:scale(1.04)}
  #chip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;display:flex;align-items:center;gap:8px;
    background:rgba(22,16,33,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,178,228,.24);
    border-radius:999px;padding:7px 13px 7px 10px;font-size:12px;font-weight:700;max-width:60%}
  #chip .dot{width:6px;height:6px;border-radius:50%;background:#D9008D;flex:0 0 auto}
  #chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chip .ct{font-size:9px;font-weight:800;letter-spacing:.08em;color:#FFB2E4;border-left:1px solid rgba(255,178,228,.3);padding-left:8px;flex:0 0 auto}
  #chip .ct.unl{color:#7BE8B0}
  #pill{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;display:flex;align-items:center;gap:6px;
    background:rgba(22,16,33,.75);backdrop-filter:blur(8px);border:1px solid rgba(255,178,228,.3);
    border-radius:999px;padding:7px 12px;font-size:11.5px;font-weight:800;color:#FFB2E4;font-variant-numeric:tabular-nums}
  #pill.amb{border-color:rgba(255,128,0,.5);color:#FFB067}
  #pill.buy2{color:#FAF9FC;border-color:rgba(255,255,255,.2)}
  #pprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.16)}
  #pprog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#D9008D,#FFB2E4)}
  #pback{position:absolute;top:calc(56px + env(safe-area-inset-top,0px));left:12px;width:38px;height:38px;border-radius:50%;
    background:rgba(22,16,33,.7);border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:17px}
  #punmute{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;
    background:rgba(217,0,141,.95);border-radius:999px;padding:12px 20px;font-size:13.5px;font-weight:700;
    box-shadow:0 6px 22px rgba(0,0,0,.45)}

  /* ---------- SHEET ---------- */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#1D1526;border-top:1px solid rgba(255,178,228,.2);
    border-radius:22px 22px 0 0;padding:18px 18px calc(80px + env(safe-area-inset-bottom,0px));
    transform:translateY(101%);transition:transform .42s cubic-bezier(.16,1,.3,1);box-shadow:0 -18px 50px rgba(0,0,0,.6)}
  .sheet.up{transform:translateY(0)}
  .grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);margin:0 auto 14px}
  .sheet h3{margin:0 0 4px;font-size:20px;font-weight:800}
  .sheet .sub{margin:0 0 14px;font-size:13px;color:#A7A1B2}
  .sheet .sub b{color:#FAF9FC}
  .offer{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(217,0,141,.18),rgba(109,23,206,.13));
    border:1px solid rgba(255,178,228,.28);border-radius:14px;padding:13px 15px;margin-bottom:12px}
  .offer .pr{font-size:30px;font-weight:900;color:#FFB2E4;line-height:1}
  .offer .pr small{font-size:15px;vertical-align:top}
  .offer .wt{font-size:14px;font-weight:700;line-height:1.3}
  .offer .wt span{display:block;font-size:11.5px;font-weight:600;color:#A7A1B2;margin-top:3px}
  .dest{display:flex;align-items:center;gap:9px;background:rgba(109,23,206,.16);border:1px solid rgba(180,140,255,.3);
    border-radius:11px;padding:10px 12px;margin-bottom:12px;font-size:11.5px;color:#D9C6FF;line-height:1.4}
  .dest img{width:22px;height:22px;border-radius:6px;flex:0 0 auto}
  .paybtn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:#D9008D;
    border-radius:13px;padding:17px;font-size:16px;font-weight:800}
  .paybtn.busy{background:#443152;color:#A7A1B2;pointer-events:none}
  .paybtn .upi{font-size:10px;font-weight:800;letter-spacing:.1em;background:rgba(255,255,255,.22);padding:3px 7px;border-radius:5px}
  .paybtn.busy .upi{display:none}
  .spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.28);border-top-color:#FFB2E4;border-radius:50%;
    animation:sp .7s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .skip{display:block;width:100%;margin-top:8px;color:#A7A1B2;font-size:13.5px;font-weight:600;padding:13px}
  .trust{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;font-size:11px;color:#665E75}
  .trust b{color:#FFB2E4;text-decoration:underline;font-weight:700}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;opacity:0;pointer-events:none;transition:opacity .3s}
  #scrim.on{opacity:1;pointer-events:auto}

  /* ---------- FULLSCREEN PANELS ---------- */
  .panel{position:fixed;inset:0;z-index:70;background:#120D1A;display:flex;flex-direction:column;
    padding:calc(18px + env(safe-area-inset-top,0px)) 18px calc(80px + env(safe-area-inset-bottom,0px));
    overflow-y:auto;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .panel h2{margin:0 0 14px;font-size:19px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
  .panel h2 button{font-size:22px;color:#A7A1B2;padding:4px 8px}
  .qa{border-bottom:1px solid rgba(255,255,255,.08);padding:11px 0}
  .qa .q{font-size:13.5px;font-weight:700;color:#FFB2E4;margin-bottom:3px}
  .qa .a{font-size:12.5px;color:#C9C3D4;line-height:1.5}
  .qa .a b{color:#7BE8B0}
  .wa{margin-top:16px;background:rgba(0,128,67,.18);border:1px solid rgba(61,201,138,.35);border-radius:12px;
    padding:13px;font-size:12.5px;color:#7BE8B0;font-weight:700;line-height:1.45}

  /* success / handoff */
  .center{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:rgba(18,13,26,.96);backdrop-filter:blur(10px);text-align:center;animation:fade .25s;
    padding:28px 28px calc(88px + env(safe-area-inset-bottom,0px))}
  .tick{width:74px;height:74px;border-radius:50%;background:#008043;display:flex;align-items:center;justify-content:center;
    font-size:38px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{transform:scale(.4);opacity:0}}
  .center .t{font-size:20px;font-weight:800}
  .center .s{font-size:13.5px;color:#A7A1B2;line-height:1.5;max-width:280px}
  .center .cta{margin-top:8px;background:#D9008D;border-radius:13px;padding:16px 26px;font-size:15px;font-weight:800;
    display:flex;align-items:center;gap:10px}
  .center .cta img{width:22px;height:22px;border-radius:6px}
  .center .alt{color:#A7A1B2;font-size:12.5px;padding:12px;font-weight:600}

  /* mock play store */
  #ps{position:fixed;inset:0;z-index:85;background:#fff;color:#202124;display:flex;flex-direction:column;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(78px + env(safe-area-inset-bottom,0px));gap:14px;animation:fade .25s}
  #ps .bar{height:40px;border-radius:20px;background:#F1F3F4;display:flex;align-items:center;padding:0 14px;font-size:13px;color:#5F6368;gap:8px}
  #ps .app{display:flex;gap:14px;align-items:center}
  #ps .app img{width:64px;height:64px;border-radius:14px}
  #ps .nm{font-size:19px;font-weight:700}
  #ps .dev{font-size:13px;color:#01875f;font-weight:600}
  #ps .meta{display:flex;justify-content:space-around;text-align:center;font-size:11px;color:#5F6368;
    border-top:1px solid #E8EAED;border-bottom:1px solid #E8EAED;padding:12px 0}
  #ps .meta b{display:block;font-size:14px;color:#202124}
  #ps .install{background:#01875f;color:#fff;border-radius:9px;padding:14px;text-align:center;font-size:15px;font-weight:700}
  #ps .shots{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none}
  #ps .shots img{height:150px;border-radius:9px;flex:0 0 auto}
  #ps .note{font-size:11px;color:#5F6368;line-height:1.5;margin-top:auto}

  /* mock dashverse app */
  #dv{position:fixed;inset:0;z-index:86;background:#0B0714;display:flex;flex-direction:column;animation:fade .3s}
  #dv .top{display:flex;align-items:center;gap:9px;padding:calc(13px + env(safe-area-inset-top,0px)) 16px 13px;
    border-bottom:1px solid rgba(255,255,255,.07)}
  #dv .top img{width:26px;height:26px;border-radius:7px}
  #dv .brand{font-size:15px;font-weight:800}
  #dv .toast{margin:13px 16px 0;background:rgba(0,128,67,.2);border:1px solid rgba(61,201,138,.4);border-radius:12px;
    padding:12px 14px;font-size:12.5px;color:#7BE8B0;font-weight:700;line-height:1.45;display:flex;gap:9px;
    animation:slidein .5s cubic-bezier(.16,1,.3,1)}
  @keyframes slidein{from{transform:translateY(-14px);opacity:0}}
  #dv .stage{flex:1;margin:13px 16px;border-radius:14px;overflow:hidden;position:relative;background:#000}
  #dv .stage video{width:100%;height:100%;object-fit:contain;background:#000}
  #dv .ov{position:absolute;left:0;right:0;bottom:0;padding:14px;background:linear-gradient(transparent,rgba(0,0,0,.9))}
  #dv .ep{font-size:14px;font-weight:800}
  #dv .sb{font-size:11.5px;color:#C9C3D4;margin-top:2px}
  #dv .bulk{margin:0 16px calc(78px + env(safe-area-inset-bottom,0px));background:rgba(109,23,206,.18);
    border:1px solid rgba(180,140,255,.3);border-radius:12px;padding:12px 14px;font-size:11.5px;color:#D9C6FF;line-height:1.45}
  #dv .back{margin-left:auto;font-size:12px;font-weight:800;color:#FFB2E4;padding:8px}

  /* ---------- mode: live channel (fullscreen) vs store (youtube layout) ---------- */
  #app.mode-live #player-wrap{position:fixed;inset:0;width:100%;height:100%;aspect-ratio:auto}
  #app.mode-live #chbar,#app.mode-live #store{display:none}
  #app.mode-store #banner,#app.mode-store #remote,#app.mode-store #coach{display:none}

  #banner{position:absolute;left:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:3;
    display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.55);border-radius:11px;padding:7px 10px 7px 8px}
  #banner .cn{font-weight:800;background:rgba(255,255,255,.15);border-radius:6px;padding:2px 8px;font-size:12px}
  #banner .nm{font-size:13px;font-weight:700}
  #banner .hb{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.12);color:#FFB2E4;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin-left:2px}

  /* channel remote (right rail) */
  #remote{position:absolute;right:12px;top:50%;transform:translateY(-50%);z-index:4;
    display:flex;flex-direction:column;align-items:center;background:rgba(0,0,0,.5);
    border:1px solid rgba(255,255,255,.16);border-radius:999px;overflow:hidden}
  #remote button{width:48px;height:46px;font-size:19px;color:#fff;display:flex;align-items:center;justify-content:center}
  #remote button:active{background:rgba(217,0,141,.35)}
  #remote .lbl{font-size:9px;font-weight:800;color:#FFB2E4;letter-spacing:.08em;padding:3px 0}

  #coach{position:absolute;right:72px;top:50%;transform:translateY(-50%);z-index:5;max-width:186px;
    background:#D9008D;color:#fff;border-radius:13px;padding:11px 13px;font-size:12.5px;font-weight:700;line-height:1.35;
    box-shadow:0 10px 28px rgba(0,0,0,.45);animation:bob 1.7s ease-in-out infinite}
  #coach::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);
    border:7px solid transparent;border-left-color:#D9008D}
  @keyframes bob{50%{transform:translateY(-50%) translateX(-6px)}}

  /* toast coach (store reveal etc.) */
  #toast{position:fixed;left:14px;right:14px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:96;
    background:#D9008D;color:#fff;border-radius:13px;padding:13px 15px;font-size:13px;font-weight:700;line-height:1.4;
    box-shadow:0 12px 34px rgba(0,0,0,.5);text-align:center;transform:translateY(20px);opacity:0;
    transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .35s;pointer-events:none}
  #toast.on{transform:translateY(0);opacity:1}

  /* CRT static beat between channels */
  #crt{position:fixed;inset:0;z-index:50;background:#0a0a0a;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px}
  #crt .noise{position:absolute;inset:0;opacity:.5;mix-blend-mode:screen;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size:170px 170px;animation:snow .16s steps(3) infinite}
  @keyframes snow{0%{background-position:0 0}33%{background-position:40px -30px}66%{background-position:-30px 50px}100%{background-position:20px 10px}}
  #crt .scan{position:absolute;left:0;right:0;height:32%;background:linear-gradient(transparent,rgba(255,255,255,.06),transparent);
    animation:sweep 1.4s linear infinite}
  @keyframes sweep{0%{top:-32%}100%{top:100%}}
  #crt .num{position:relative;font-size:60px;font-weight:900;color:#FFB2E4;text-shadow:0 0 18px rgba(217,0,141,.6);animation:flick .1s steps(1) 4}
  @keyframes flick{50%{opacity:.55}}
  #crt .nm{position:relative;font-size:14px;font-weight:700;color:#FAF9FC;letter-spacing:1px}
  #crt.hide{display:none}

  /* Dashverse -> back to Wiom popup */
  #dvpop{position:absolute;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;
    background:#1D1526;border:1px solid rgba(255,178,228,.3);border-radius:16px;padding:14px 15px;
    display:flex;align-items:center;gap:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);animation:slideup .42s cubic-bezier(.16,1,.3,1)}
  @keyframes slideup{from{transform:translateY(28px);opacity:0}}
  #dvpop .di{flex:1;min-width:0}
  #dvpop .dt{font-size:13px;font-weight:800}
  #dvpop .dd{font-size:11px;color:#A7A1B2;margin-top:2px;line-height:1.35}
  #dvpop .dgo{background:#D9008D;border-radius:11px;padding:11px 14px;font-size:12.5px;font-weight:800;white-space:nowrap;flex:0 0 auto}

  /* ---------- demo bar ---------- */
  #demo{position:fixed;left:0;right:0;bottom:0;z-index:95;display:flex;gap:7px;padding:9px 10px calc(9px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(transparent,rgba(11,8,18,.94) 34%);pointer-events:none}
  #demo button{pointer-events:auto;flex:1;border:1px dashed rgba(255,178,228,.55);background:rgba(22,16,33,.88);
    color:#FFB2E4;border-radius:11px;padding:11px 5px;font-size:10.5px;font-weight:700;line-height:1.3}
  #demo button:active{background:rgba(217,0,141,.28)}
  /* help lives in the channel bar so it never fights the player's own controls */
  #helpbtn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.09);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#FFB2E4;flex:0 0 auto}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ══ UI GUIDE (added) — demo scaffolding. Deliberately NOT a Wiom product
     colour, so it can never be mistaken for real UI. ══ */
  #uig-spot{position:fixed;z-index:9997;border-radius:12px;pointer-events:none;
    box-shadow:0 0 0 3px #B98CFF,0 0 0 9999px rgba(6,4,11,.58);
    transition:all .28s cubic-bezier(.2,.8,.3,1);animation:uigHalo 1.6s ease-in-out infinite}
  @keyframes uigHalo{50%{box-shadow:0 0 0 6px rgba(185,140,255,.55),0 0 0 9999px rgba(6,4,11,.58)}}
  #uig{position:fixed;z-index:9998;max-width:250px;background:#241437;border:1.5px solid #B98CFF;
    border-radius:12px;padding:11px 13px;box-shadow:0 14px 38px rgba(0,0,0,.72);
    transition:all .28s cubic-bezier(.2,.8,.3,1)}
  #uig .lb{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:900;letter-spacing:.14em;
    text-transform:uppercase;color:#B98CFF;margin-bottom:4px}
  #uig .lb::before{content:"\25C6"}
  #uig .tx{font-size:12.5px;font-weight:700;line-height:1.4;color:#FAF9FC}
  #uig .tx b{color:#B98CFF}
  #uig-btn{position:fixed;z-index:9999;top:calc(9px + env(safe-area-inset-top,0px));left:50%;
    transform:translateX(-50%);background:#6D17CE;color:#fff;border-radius:999px;padding:5px 12px;
    font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;
    box-shadow:0 4px 14px rgba(0,0,0,.5);border:1px solid #B98CFF}
  #uig-btn.off{background:rgba(10,6,18,.7);border-color:rgba(255,255,255,.25);color:#A7A1B2}
  body.uig-off #uig,body.uig-off #uig-spot{display:none!important}
</style>

/* ---------- state ---------- */
const K = 'wiom-mock-v1';
const load = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch { return {}; } };
const save = s => { try { localStorage.setItem(K, JSON.stringify(s)); } catch {} };
let S = load();                       // {pack:{app,until,used}, last:{app,at,used}, seen:[]}

const packLeft = () => S.pack ? Math.max(0, S.pack.until - Date.now()) : 0;
const hasPack  = () => packLeft() > 0;
const fmt = ms => {
  const m = Math.floor(ms/60000), h = Math.floor(m/60);
  return h > 0 ? h + ' घं. ' + (m%60) + ' मि.' : m + ' मिनट';
};

/* ---------- live TV ---------- */
(function initTV(){
  const v = $('tv'), fb = $('tv-fallback');
  const ok = () => { fb.style.display = 'none'; };
  if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({ maxBufferLength: 10 });
    hls.loadSource(HLS_URL); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().then(ok).catch(()=>{}));
    hls.on(Hls.Events.ERROR, (e,d) => { if (d.fatal) fb.style.display = 'block'; });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = HLS_URL; v.addEventListener('loadeddata', ok); v.play().catch(()=>{});
  }
  $('tv-sound').onclick = () => {
    v.muted = !v.muted;
    $('tv-sound').innerHTML = v.muted ? '&#128263;' : '&#128266;';
    if (!v.muted) v.play().catch(()=>{});
  };
})();

/* ---------- channels + mode + coaching ---------- */
const CH = [ {ch:2, name:'Dangal TV', live:true}, {ch:21, name:'माइक्रोड्रामा', md:true} ];
let ci = 0;

function setMode(m){ $('app').className = 'mode-' + m; }
const mode = () => $('app').classList.contains('mode-store') ? 'store' : 'live';

function setBanner(){
  const c = CH[ci];
  $('banner').querySelector('.cn').textContent = c.ch;
  $('banner').querySelector('.nm').textContent = c.name;
}
function dismissCoach(){ const c = $('coach'); if (c) c.style.display = 'none'; }

let toastT = null;
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms || 3600);
}

/* CRT static beat, then callback */
function crt(num, name, cb){
  const c = $('crt');
  c.querySelector('.num').textContent = num;
  c.querySelector('.nm').textContent = name;
  c.classList.remove('hide');
  setTimeout(() => { c.classList.add('hide'); cb && cb(); }, 750);
}

/* channel remote: only two channels, so up/down both flip */
function tuneChannel(dir){
  dismissCoach();
  ci = (ci + dir + CH.length) % CH.length;
  const c = CH[ci];
  setBanner();
  crt(c.ch, c.name, () => {
    if (c.md) openPromo('dashverse', firstUnseen('dashverse'));   // microdrama channel = promos
    // live channel: #tv keeps playing underneath, nothing else to do
  });
}
$('ch-up').onclick = () => tuneChannel(1);
$('ch-dn').onclick = () => tuneChannel(-1);

/* rotate to a show the viewer hasn't seen yet (falls back to first) */
function firstUnseen(appKey){
  const shows = APPS[appKey].shows, seen = S.seen || [];
  for (let i = 0; i < shows.length; i++){ const k = appKey + ':' + i; if (!seen.includes(k)) return i; }
  return 0;
}
function markSeen(appKey, idx){
  S.seen = S.seen || []; const k = appKey + ':' + idx;
  if (!S.seen.includes(k)) { S.seen.push(k); save(S); }
}

/* returning from any partner app -> reveal the sachet store as the home */
function returnToWiom(){
  ['dv','ps','succ'].forEach(i => { const el = $(i); if (el) el.remove(); });
  const pop = $('dvpop'); if (pop) pop.remove();
  $('promo').classList.add('hide');
  try { pv.pause(); pv.removeAttribute('src'); pv.removeAttribute('poster'); pv.load(); } catch {}
  pv.classList.remove('frozen');
  clearTimeout(staticT); cur = null;
  setMode('store'); ci = 0; setBanner();
  $('tv').play().catch(()=>{});
  renderStore();
  if (!S.storeSeen){ S.storeSeen = 1; save(S);
    setTimeout(() => toast('यह है आपका पैक स्टोर 👇 किसी भी शो पर टैप करके फिर देखें', 5000), 500); }
}

    const a = APPS[S.pack.app], left = packLeft();

    const amb = left < 60*60e3;

      <div class="runcard ${amb?'amb':''}">

/* ---------- promo playback ---------- */
let cur = null;                       // {app, idx}
const pv = $('pv');
let forced = false;
let staticT = null;

function promoChrome(appKey, s){
  $('promo').classList.remove('hide');
  pv.classList.remove('frozen');
  $('chip').querySelector('.nm').textContent = s.title;
  const unl = hasPack() && S.pack.app === appKey;
  $('chip').querySelector('.ct').textContent = unl ? 'अनलॉक्ड' : 'प्रोमो';
  $('chip').querySelector('.ct').className = 'ct' + (unl ? ' unl' : '');
  updatePill();
  $('tv').pause();
}

function openPromo(appKey, idx){
  const s = APPS[appKey].shows[idx];
  cur = { app: appKey, idx };
  markSeen(appKey, idx);
  clearTimeout(staticT);
  if (s.slug){                                    // Dashverse: real promo video
    promoChrome(appKey, s);
    $('pprog').style.display = '';
    pv.removeAttribute('poster');
    pv.src = 'md/' + s.slug + '.mp4';
    pv.currentTime = 0; pv.load();
    pv.play().catch(() => {
      pv.muted = true; forced = true;
      pv.play().then(()=> $('punmute').classList.remove('hide')).catch(()=>{});
    });
  } else {                                        // others: static beat, then poster-as-promo, then offer
    crt('▶', APPS[appKey].name, () => {
      if (!cur || cur.app !== appKey) return;
      promoChrome(appKey, s);
      $('pprog').style.display = 'none';
      pv.removeAttribute('src');
      pv.poster = s.poster; pv.load();
      staticT = setTimeout(() => { if (cur && cur.app === appKey){ pv.classList.add('frozen'); openSheet(appKey); } }, 2600);
    });
  }
}
function closePromo(){
  clearTimeout(staticT);
  $('promo').classList.add('hide');
  try { pv.pause(); pv.removeAttribute('src'); pv.removeAttribute('poster'); pv.load(); } catch {}
  pv.classList.remove('frozen'); $('punmute').classList.add('hide');
  closeSheet(); cur = null;
  if (mode() === 'live'){ ci = 0; setBanner(); }   // leaving the promo channel -> back to live TV
  $('tv').play().catch(()=>{});
  renderStore();
}
function updatePill(){
  const p = $('pill');
  if (hasPack()){
    const left = packLeft();
    p.textContent = fmt(left);
    p.className = left < 60*60e3 ? 'amb' : '';
  } else { p.textContent = 'पैक लें'; p.className = 'buy2'; }
}
pv.addEventListener('timeupdate', () => {
  if (!pv.duration) return;
  $('pprog').firstElementChild.style.width = (pv.currentTime/pv.duration*100) + '%';
  updatePill();
});
pv.addEventListener('ended', () => {
  if (!cur) return;
  if (hasPack() && S.pack.app === cur.app){       // pack holder: roll straight into the next show
    const n = (cur.idx + 1) % APPS[cur.app].shows.length;
    openPromo(cur.app, n); return;
  }
  pv.classList.add('frozen');
  openSheet(cur.app);
});
$('pback').onclick = closePromo;
$('punmute').onclick = () => { pv.muted = false; forced = false; $('punmute').classList.add('hide'); };
document.addEventListener('click', e => {
  if (!forced || pv.muted === false) return;
  if (e.target.closest('#punmute, #sheet, #demo')) return;

/* ══════════════════════════════════════════════════════════════════════════
   UI GUIDE + flow variant — ADDITIVE ONLY. Nothing above this line is changed;
   the original functions are wrapped, not edited, so the experience is the
   same walk it always was.

   ?flow=wiom     sachet store WITHOUT the third-party platform — after paying,
                  the viewer stays on Wiom. The install path is not offered.
   ?flow=partner  the original: pay, then install the partner app. (default)
   ══════════════════════════════════════════════════════════════════════════ */
(function(){
  var FLOW = (new URLSearchParams(location.search).get('flow') === 'wiom') ? 'wiom' : 'partner';

  var spot = document.createElement('div'); spot.id = 'uig-spot'; spot.style.display = 'none';
  var box  = document.createElement('div'); box.id  = 'uig';      box.style.display  = 'none';
  box.innerHTML = '<div class="lb">UI guide</div><div class="tx"></div>';
  var btn  = document.createElement('button'); btn.id = 'uig-btn'; btn.textContent = '◆ UI guide';
  document.body.appendChild(spot); document.body.appendChild(box); document.body.appendChild(btn);

  var on = true, last = null;
  btn.onclick = function(){
    on = !on;
    document.body.classList.toggle('uig-off', !on);
    btn.classList.toggle('off', !on);
    if (on && last) guide(last.sel, last.txt);
  };

  /* place the ring + callout over whatever must be pressed next */
  function guide(sel, txt, delay){
    last = {sel:sel, txt:txt};
    setTimeout(function(){
      if (!on) return;
      box.querySelector('.tx').innerHTML = txt;
      box.style.display = 'block';
      var el = sel ? document.querySelector(sel) : null;
      var vis = el && el.offsetParent !== null && el.getBoundingClientRect().width > 0;
      var W = innerWidth, H = innerHeight;
      if (vis){
        var r = el.getBoundingClientRect(), pad = 6;
        /* first appearance: land on the target instead of sliding in from the corner */
        var fresh = spot.style.display === 'none';
        if (fresh){ spot.style.transition = 'none'; box.style.transition = 'none'; }
        spot.style.display = 'block';
        spot.style.left = (r.left - pad) + 'px';  spot.style.top = (r.top - pad) + 'px';
        spot.style.width = (r.width + pad*2) + 'px'; spot.style.height = (r.height + pad*2) + 'px';
        var bw = box.offsetWidth, bh = box.offsetHeight;
        box.style.left = Math.max(10, Math.min(r.left - 8, W - bw - 10)) + 'px';
        var below = r.bottom + 14 + bh < H - 10;
        /* never park the callout on top of another button the viewer can press */
        var bl = parseFloat(box.style.left) || 10;
        var covers = function(top){
          var c = {l:bl, r:bl+bw, t:top, b:top+bh};
          return [].some.call(document.querySelectorAll('button,.cta,.alt,.install,.open'), function(o){
            if (o === el || o.offsetParent === null) return false;
            var q = o.getBoundingClientRect();
            if (!q.width || !q.height) return false;
            return c.l < q.right && c.r > q.left && c.t < q.bottom && c.b > q.top;
          });
        };
        var topBelow = r.bottom + 14, topAbove = Math.max(10, r.top - bh - 14);
        if (below && covers(topBelow) && r.top - bh - 14 > 10 && !covers(topAbove)) below = false;
        box.style.top = (below ? topBelow : topAbove) + 'px';
        if (fresh) requestAnimationFrame(function(){ spot.style.transition = ''; box.style.transition = ''; });
      } else {
        spot.style.display = 'none';
        box.style.left = '10px';
        box.style.top  = Math.max(10, H - box.offsetHeight - 96) + 'px';
      }
    }, delay || 60);
    /* Screens animate in AND carry <img> (app logos, posters) that reflow the centred
       column when they decode — measuring once leaves the ring behind. Settle again on a
       timer, and again whenever a still-loading image in this screen finishes. */
    if (delay !== 0){
      setTimeout(function(){ if (on && last && last.sel === sel) guide(sel, txt, 0); }, (delay || 60) + 450);
      setTimeout(function(){
        var el2 = sel ? document.querySelector(sel) : null;
        var scope = (el2 && el2.closest('#succ,#ps,#dv,#app')) || document;
        scope.querySelectorAll('img').forEach(function(im){
          if (!im.complete) im.addEventListener('load', function(){
            if (on && last && last.sel === sel) guide(sel, txt, 0);
          }, {once:true});
        });
      }, (delay || 60) + 20);
    }
  }
  function clearGuide(){ last = null; spot.style.display = 'none'; box.style.display = 'none'; }
  addEventListener('resize', function(){ if (last) guide(last.sel, last.txt, 0); });

  /* ── wrap the existing lifecycle points; none of them are modified ── */
  var _tune = tuneChannel;
  tuneChannel = function(d){ clearGuide(); _tune(d);
    guide(null, 'प्रोमो चैनल चालू. The promo plays like any other channel — nothing is gated yet.', 1000); };

  var _openSheet = openSheet;
  openSheet = function(k){ _openSheet(k);
    guide('#paybtn', 'Promo ends and the offer slides up. <b>Press ₹10 देकर देखते रहिए</b> — this is the promo-to-purchase moment.', 520); };

  var _closeSheet = closeSheet;
  closeSheet = function(){ _closeSheet(); clearGuide(); };

  var _showSuccess = showSuccess;
  showSuccess = function(k){
    _showSuccess(k);
    if (FLOW === 'wiom'){
      /* no third-party platform in this variant: drop the install door entirely
         and promote the stay-on-Wiom button to the primary action */
      var open = document.getElementById('openapp'); if (open) open.remove();
      var later = document.getElementById('laterbtn');
      if (later){
        later.className = 'cta';
        later.textContent = 'Wiom TV पर देखते रहिए →';
      }
      /* the stock line promises the partner app — there isn't one in this variant */
      var sub = document.querySelector('#succ .s');
      if (sub){
        var b = sub.querySelector('b');
        sub.innerHTML = 'अब ' + (b ? b.outerHTML : 'यह शो') + ' यहीं Wiom TV पर वहीं से चलेगा';
      }
      guide('#laterbtn', 'Paid. <b>The viewer stays on Wiom</b> — nothing to install, nothing to log into. Straight into the sachet store.', 420);
    } else {
      guide('#openapp', 'Paid. <b>This is the only step option 2 does not have</b> — the partner app is opened, carrying a signed token.', 420);
    }
  };

  var _showStore = showStore;
  showStore = function(k){ _showStore(k);
    guide('#installbtn', 'The store page. <b>Press Install</b> — Wiom sends a token with this link so the app knows who they are.', 420); };

  var _showApp = showApp;
  showApp = function(k){ _showApp(k);
    guide(null, 'Watching continues inside the partner app — <b>no second login, no second payment</b>. The token carried it across.', 700); };

  var _return = returnToWiom;
  returnToWiom = function(){ _return();
    guide('#store .runcard .open', 'This is the sachet store — <b>your pack, on Wiom</b>. Tap any show to carry on watching.', 700); };

  /* first step: the walk starts by changing channel */
  guide('#ch-up', 'Start here. <b>Press ▲</b> to change channel and reach the promo channel.', 900);
})();
</script>
</body>
</html>
